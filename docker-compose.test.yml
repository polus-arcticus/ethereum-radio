services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - --host=0.0.0.0
      - --chain-id=31337
      - --mnemonic=test test test test test test test test test test test junk
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 1s
      timeout: 3s
      retries: 20

  rpc-limiter:
    build: ./docker/rpc-limiter
    environment:
      UPSTREAM_URL: http://anvil:8545
      # 10 is one of rpc-doctor's own RANGE_CANDIDATES (...,100,10,5,1), so
      # its step-down test can assert on an exact, unambiguous landing value.
      MAX_LOG_RANGE: "10"
    ports:
      - "8546:8546"
    depends_on:
      anvil:
        condition: service_healthy
