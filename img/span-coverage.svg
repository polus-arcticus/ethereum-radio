<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="A scanned window closing the gap between two spans, merging them into one">
	<style>
		.er-span-fill {
			animation: er-span-merge 4s ease-in-out infinite;
			opacity: 0;
		}
		.er-merge-label {
			animation: er-span-merge 4s ease-in-out infinite;
			opacity: 0;
		}
		@keyframes er-span-merge {
			0%, 8% { opacity: 0; }
			22%, 78% { opacity: 1; }
			92%, 100% { opacity: 0; }
		}
		@media (prefers-reduced-motion: reduce) {
			.er-span-fill { animation: none; opacity: 1; }
			.er-merge-label { animation: none; opacity: 1; }
		}
	</style>

	<rect x="60" y="90" width="640" height="40" rx="10" fill="none" stroke="#cbd5e1" stroke-width="2"/>

	<rect x="60" y="90" width="220" height="40" rx="10" fill="#6366f1"/>
	<rect class="er-span-fill" x="280" y="90" width="100" height="40" fill="#6366f1"/>
	<rect x="380" y="90" width="220" height="40" rx="10" fill="#6366f1"/>

	<text class="er-merge-label" x="330" y="76" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="13">mergeSpan()</text>

	<g fill="#a5b4fc" font-family="monospace" font-size="13">
		<text x="60" y="158">floorBlock</text>
		<text x="700" y="158" text-anchor="end">tip</text>
	</g>
</svg>
