<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ethereum Radio">
	<style>
		@keyframes er-logo-pulse {
			0%, 100% { opacity: 0.25; }
			50% { opacity: 0.95; }
		}
		.er-logo-wave { animation: er-logo-pulse 2.4s ease-in-out infinite; }
		.er-logo-wave--mid { animation-delay: 0.25s; }
		.er-logo-wave--outer { animation-delay: 0.5s; }
		@media (prefers-reduced-motion: reduce) {
			.er-logo-wave { animation: none; opacity: 0.7; }
		}
	</style>
	<g fill="none" stroke="#22d3ee" stroke-linecap="round">
		<path class="er-logo-wave er-logo-wave--inner" d="M 36 20 A 6 6 0 0 1 30 14" stroke-width="2.5"/>
		<path class="er-logo-wave er-logo-wave--mid" d="M 40 20 A 10 10 0 0 1 30 10" stroke-width="2.5" opacity="0.6"/>
		<path class="er-logo-wave er-logo-wave--outer" d="M 44 20 A 14 14 0 0 1 30 6" stroke-width="2.5" opacity="0.35"/>
	</g>
	<g stroke="rgba(15, 23, 42, 0.25)" stroke-width="0.5" stroke-linejoin="round">
		<polygon points="30,20 14,38 30,38" fill="#a5b4fc"/>
		<polygon points="30,20 30,38 46,38" fill="#6366f1"/>
		<polygon points="14,38 30,56 30,38" fill="#4f46e5"/>
		<polygon points="46,38 30,38 30,56" fill="#3730a3"/>
	</g>
</svg>
